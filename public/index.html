<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>TempMail Lite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="card center-content">
            <h1>🔒 Accesso</h1>
            <input type="tel" id="auth-code" placeholder="Codice (1234)" style="text-align:center; letter-spacing: 5px;">
            <br>
            <button class="btn btn-primary full-width" onclick="login()">ENTRA</button>
            <p id="login-error">Codice errato</p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        
        <!-- Header / Stats -->
        <header>
            <div class="logo">TempMail <span style="font-size:0.8em; color:var(--text-light)">Manager</span></div>
            <div id="disk-stats" class="badge">Disco: ...</div>
        </header>

        <!-- Form Creazione -->
        <div class="card creation-bar">
            <div class="input-group" style="flex-grow: 1;">
                <span class="prefix">sterzomail+</span>
                <input type="text" id="new-alias" placeholder="etichetta">
            </div>
            <div class="input-group" style="gap: 15px;">
                <select id="duration">
                    <option value="1">1 Giorno</option>
                    <option value="7">1 Settimana</option>
                    <option value="30">1 Mese</option>
                    <option value="inf">Infinito</option>
                </select>
                <button class="btn btn-primary" onclick="createAlias()">＋ Crea</button>
            </div>
        </div>

        <div class="grid-layout">
            
            <!-- LISTA ALIAS -->
            <div class="card">
                <div class="card-header">
                    <h2>Account Attivi</h2>
                    <button class="btn btn-sm" onclick="toggleSelectAll()" title="Seleziona tutti">☑ Tutti</button>
                </div>
                
                <div class="alias-list-container">
                    <ul id="alias-list">
                        <!-- Popolato via JS -->
                    </ul>
                </div>
            </div>

            <!-- POSTA IN ARRIVO -->
            <div class="card">
                <div class="card-header">
                    <h2>Posta in arrivo <span id="mail-count">(0)</span></h2>
                    <button class="btn btn-sm" onclick="forceRefresh()" title="Aggiorna ora">↻</button>
                </div>

                <div id="mail-list">
                    <!-- Lista messaggi -->
                </div>
            </div>

        </div> <!-- End Grid -->

        <!-- MODALE VISTA MAIL -->
        <div id="mail-view" class="overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="view-subject">Oggetto</h3>
                    <button class="btn btn-close" onclick="closeMail()">✕</button>
                </div>
                <div class="modal-meta">
                    <p><strong>Da:</strong> <span id="view-from"></span></p>
                    <p><strong>A:</strong> <span id="view-to"></span></p>
                </div>
                <div class="modal-body" id="mail-content-wrapper">
                    <!-- iframe here -->
                </div>
            </div>
        </div>

    </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
