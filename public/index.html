<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail Manager</title>
    <!-- Collegamento al file CSS esterno -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- LOGIN -->
    <div id="login-screen">
        <h1>Accesso Riservato</h1>
        <input type="password" id="auth-code" placeholder="Codice (1234)">
        <button class="btn" onclick="login()">Entra</button>
        <p id="login-error">Codice errato</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <header>
            <h1>Mail Manager</h1>
            <div class="stats" id="disk-stats">Caricamento spazio disco...</div>
        </header>

        <!-- Crea Alias -->
        <div class="card">
            <div class="flex">
                <span style="font-weight:bold">sterzomail+</span>
                <input type="text" id="new-alias" placeholder="etichetta" style="width:100px">
                <span style="font-weight:bold">@alwaysdata.net</span>

                <select id="duration">
                    <option value="1">1 Giorno</option>
                    <option value="7">1 Settimana</option>
                    <option value="inf">Infinito</option>
                </select>
                <button class="btn" onclick="createAlias()">Crea</button>
                <button class="btn" onclick="loadData()">Aggiorna</button>
            </div>
            <p style="font-size:0.8em; color:#666; margin-top:5px;">
                Inserisci un nome (es. 'amazon') per creare sterzomail+amazon@alwaysdata.net
            </p>
        </div>

        <div class="grid">
            <!-- Colonna SX: Alias -->
            <div class="card">
                <h2>Account Attivi</h2>
                <div style="overflow-x:auto;">
                    <table id="alias-table">
                        <thead><tr><th>Indirizzo</th><th>Scadenza</th><th>Az.</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Colonna DX: Posta -->
            <div class="card">
                <h2>Posta in arrivo (Tutti)</h2>
                <div id="mail-list">
                    <!-- Lista messaggi -->
                </div>
                
                <div id="mail-view" class="hidden">
                    <hr>
                    <h3 id="view-subject"></h3>
                    <p><strong>Da:</strong> <span id="view-from"></span> | <strong>A:</strong> <span id="view-to"></span></p>
                    <div id="mail-content"></div>
                    <button class="btn" onclick="closeMail()" style="margin-top:10px;">Chiudi</button>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Collegamento al file JS esterno (defer assicura che il DOM sia pronto) -->
<script src="script.js" defer></script>

</body>
</html>
